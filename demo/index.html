<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cove Liquid Glass Demo</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-wallpaper="./assets/demo-backdrop.svg">
  <main>
    <p class="kicker">COVE OPTICS / PUBLIC DEMO</p>
    <h1>一块真正会看见背景的玻璃。</h1>
    <p class="lede">CSS 定义形，WebGL 定义光。拖动页面或调整窗口，局部采样仍会与背景保持对齐。</p>

    <section class="specimens" aria-label="Liquid glass specimens">
      <article class="liquid" data-material="clear">
        <span class="index">01</span>
        <h2>Clear</h2>
        <p>全表面折射，中心轻、边缘更明显。文字保留在独立 DOM 层。</p>
      </article>
      <article class="liquid smoked" data-material="smoked">
        <span class="index">02</span>
        <h2>Smoked</h2>
        <p>保留背景细节，通过透射衰减与内侧暗部形成重量。</p>
      </article>
      <article class="liquid hero" data-material="hero">
        <span class="index">03</span>
        <h2>Soft sample</h2>
        <p>只有重点表面启用轻量九点高斯采样，折射与模糊分别控制。</p>
      </article>
    </section>
  </main>
  <script src="./liquid-glass.js"></script>
</body>
</html>
